<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Couldn't start</title>
<style>
  :root { --bg: #f6f8fc; --fg: #10131a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  .band { position: fixed; inset: 0 0 auto 0; height: 34px; -webkit-app-region: drag; }
  main { max-width: 760px; margin: 0 auto; padding: 64px 28px 28px; display: flex; flex-direction: column; gap: 14px; height: 100%; box-sizing: border-box; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  p { margin: 0; line-height: 1.55; opacity: .8; }
  pre { flex: 1; min-height: 120px; margin: 0; overflow: auto; padding: 12px 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.5 "Cascadia Mono", Consolas, monospace; background: color-mix(in srgb, var(--fg) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer; color: var(--fg);
    background: transparent; border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:focus-visible { outline: 2px solid color-mix(in srgb, var(--fg) 60%, transparent); outline-offset: 2px; }
  code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
<div class="band"></div>
<main>
  <h1 id="title">Namma Agent couldn't start</h1>
  <p id="detail">The local engine stopped before it was ready.</p>
  <pre id="log" aria-label="Recent engine output">Loading…</pre>
  <p>Full log: <code id="logfile"></code></p>
  <div class="row">
    <button class="primary" id="retry">Retry</button>
    <button id="logs">Open logs folder</button>
    <button id="quit">Quit</button>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const ok = (c) => /^#[0-9a-f]{6}$/i.test(c || "");
  if (ok(q.get("bg"))) document.documentElement.style.setProperty("--bg", q.get("bg"));
  if (ok(q.get("fg"))) document.documentElement.style.setProperty("--fg", q.get("fg"));
  const api = window.nammaDesktop;
  api.boot.info().then((i) => {
    if (i.name) document.getElementById("title").textContent = `${i.name} couldn't start`;
    if (i.detail) document.getElementById("detail").textContent = i.detail;
    document.getElementById("log").textContent = i.tail || "(no output)";
    document.getElementById("logfile").textContent = i.logFile || "";
    const pre = document.getElementById("log"); pre.scrollTop = pre.scrollHeight;
  });
  document.getElementById("retry").onclick = (e) => { e.target.disabled = true; e.target.textContent = "Starting…"; api.boot.retry(); };
  document.getElementById("logs").onclick = () => api.revealLogs();
  document.getElementById("quit").onclick = () => api.boot.quit();
  document.getElementById("retry").focus();
</script>
</body>
</html>
