name: Release

# Builds the branded native installer on EACH OS (so you don't need to own all
# three machines) and attaches them to the GitHub Release. Triggers when you push
# a version tag, e.g.  git tag v2.3.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}      # also runnable by hand from the Actions tab

permissions:
  contents: write            # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS twice on purpose: macos-15 runners are Apple Silicon (arm64),
        # macos-13 are Intel (x86_64) — one DMG per architecture, arch-suffixed
        # by build.py, so users on the newest Macs get a native build instead
        # of an unlabeled Intel one (or nothing).
        os: [windows-latest, macos-15, macos-13, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so `git archive` works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PyInstaller + pywebview
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Install WebKitGTK for pywebview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        # AppImage/appimagetool (maintained), NOT the archived AppImageKit:
        # its static runtime means the produced AppImage does not need libfuse2 —
        # which Ubuntu 22.04+ no longer ships, i.e. this is what makes the
        # AppImage actually run on current distros.
        run: |
          sudo curl -L -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build native installer
        run: python installers/native/build.py

      - name: Build ready-to-run source zip (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('namma_agent/version.py').read()).group(1))")
          mv installers/native/build/app "installers/native/build/Namma-Agent-$VER"
          (cd installers/native/build && zip -qr "../dist/Namma-Agent-$VER.zip" "Namma-Agent-$VER")

      - name: Upload installers to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installers/native/dist/*
          generate_release_notes: true
          append_body: true
          body: |
            **Which file do I download?**
            - **Windows desktop app (recommended)** → `NammaAgentSetup-<ver>.exe` — installs the native app (no admin needed); updates itself from later releases
            - **Windows (classic installer)** → `NammaAgentInstaller-<ver>.exe`
            - **Mac (Apple Silicon — M1 and later)** → `NammaAgent-<ver>-arm64.dmg`
            - **Mac (Intel)** → `NammaAgent-<ver>-x86_64.dmg`
            - **Linux** → `NammaAgentInstaller-<ver>-x86_64.AppImage` (`chmod +x`, then run — no libfuse2 needed), or the source zip
            - **Server/VPS** → skip the installers: [one-line install](https://github.com/SanthoshReddy352/Namma-Agent/blob/main/docs/DEPLOY.md)

            *macOS note: the app isn't code-signed yet. If macOS blocks it, right-click → Open, or approve it under System Settings → Privacy & Security.*

      - name: Upload installers as build artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: namma-agent-installer-${{ matrix.os }}
          path: installers/native/dist/*

  # Phase 9 W3: the Electron desktop app — per-user NSIS installer with the Python
  # runtime bundled. Uploads the three files electron-updater needs to the
  # Release: NammaAgentSetup-<ver>.exe, its .blockmap, and latest.yml (installed
  # apps read latest.yml from the newest release to offer the update).
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the version (namma_agent/version.py)
        id: ver
        shell: bash
        run: |
          VER=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('namma_agent/version.py').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building Namma Agent desktop $VER"

      - name: Install the desktop build tools
        working-directory: desktop
        run: npm ci

      - name: Stage the backend, web UI and bundled Python
        working-directory: desktop
        run: node scripts/stage.js

      - name: Build the NSIS installer
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never -c.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Upload the desktop installer to the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/out/NammaAgentSetup-*.exe
            desktop/out/NammaAgentSetup-*.exe.blockmap
            desktop/out/latest.yml

      - name: Upload the desktop installer as a build artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: namma-agent-desktop-windows
          path: |
            desktop/out/NammaAgentSetup-*.exe
            desktop/out/NammaAgentSetup-*.exe.blockmap
            desktop/out/latest.yml
